name: canary
on: workflow_dispatch
jobs:
  r:
    runs-on: ubuntu-latest
    steps:
      - name: reach
        run: |
          set +e
          echo "### POSITIVE CONTROL - DNS works at all"
          getent hosts github.com; echo "  rc=$?"
          echo "### NEGATIVE CONTROL - invented .github.net host (must NOT resolve)"
          getent hosts zzq-definitely-not-real-9184.github.net; echo "  rc=$?"
          echo "### ARM - vendor-designated canary"
          getent hosts ssrf-target.iad.github.net; echo "  rc=$?"
          echo "### ARM - HTTP to the canary"
          curl -sS -m 20 -o /dev/null -w '  canary HTTP:%{http_code} dns:%{time_namelookup}s conn:%{time_connect}s total:%{time_total}s remote:%{remote_ip}
' http://ssrf-target.iad.github.net/ ; echo "  rc=$?"
          echo "### CONTROL - HTTP to the invented host"
          curl -sS -m 20 -o /dev/null -w '  invented HTTP:%{http_code} remote:%{remote_ip}
' http://zzq-definitely-not-real-9184.github.net/ ; echo "  rc=$?"
          echo "### CONTROL - HTTP to a known-good public host"
          curl -sS -m 20 -o /dev/null -w '  github.com HTTP:%{http_code} remote:%{remote_ip}
' https://github.com/ ; echo "  rc=$?"
          echo "### runner egress identity"
          curl -sS -m 20 https://api.ipify.org; echo
